# Post AWS->DO migration: main builds/pushes to GHCR and deploys straight to
# do-prod (the only live cluster — EKS dev/prod are retired). Filename kept to
# preserve any required-status-check config; see the job below for the real target.
name: Build & Deploy Platform to Prod (GitOps)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      # Uncomment when unit tests are ready
      # - name: Run unit tests
      #   run: npm run test:unit:ci

  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write   # push to ghcr.io/openmeet-team/openmeet-platform via GITHUB_TOKEN
    outputs:
      image_tag: ${{ steps.set-outputs.outputs.image_tag }}

    steps:
      - name: Checkout Platform repository
        uses: actions/checkout@v4

      # Auth to GHCR. GITHUB_TOKEN works once the package is linked to this repo
      # (Package settings -> Manage Actions access -> add openmeet-platform = Write).
      # To use a PAT instead: set password to ${{ secrets.GHCR_PAT }} and drop the
      # packages: write permission above.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: set-outputs
        run: |
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push image to GHCR
        env:
          IMAGE: ghcr.io/openmeet-team/openmeet-platform
        run: |
          set -euo pipefail
          echo "Building $IMAGE:$IMAGE_TAG"
          APP_VERSION=$(node -p "require('./package.json').version")
          docker buildx build --load \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            -t "$IMAGE:$IMAGE_TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$IMAGE_TAG"
          docker push "$IMAGE:latest"

  gitops-update:
    needs: [build-and-deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/update-image-gitops.yml
    with:
      service_name: platform
      image_tag: ${{ needs.build-and-deploy.outputs.image_tag }}
      image_name: ghcr.io/openmeet-team/openmeet-platform
      environment: do-prod
      commit_message: "GitOps: deploy platform ${{ needs.build-and-deploy.outputs.image_tag }} to do-prod (main)"
    secrets:
      GH_PAT: ${{ secrets.GH_PAT_INFRASTRUCTURE }}
